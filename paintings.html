<!doctype html>
<html>

<head>
  <title>Nastya Ku, Paintings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="styles/main.css" />
  <link rel="stylesheet" type="text/css" href="styles/header.css" />
  <link href='https://fonts.googleapis.com/css?family=Ubuntu' rel='stylesheet'>
  <meta charset=utf-8>
  <script src="scripts/navbar.js"></script>
  <style>
    .paintings-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .painting-card {
      border: 1px solid #ccc;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 5px;
      background-color: #f9f9f9;
      text-align: center;
    }
    .painting-card img {
      max-width: 100%;
      height: auto;
      margin-top: 15px;
      border-radius: 3px;
    }
    .painting-meta {
      font-style: italic;
      color: #666;
      margin-top: 10px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      font-family: 'Ubuntu', sans-serif;
    }
    .instruction {
      font-size: 0.9em;
      color: #555;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <site-navbar></site-navbar>
  <div class="main-content">
    <div class="paintings-container">
      <h2>Favorite Paintings</h2>
      <p class="instruction">To add a new painting, edit the markdown inside the <code>paintings-data.js</code> file.</p>
      
      <div class="form-group" style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" id="searchInput" placeholder="Search by title or author..." onkeyup="renderPaintings()" style="flex: 1; min-width: 200px;">
      </div>
      <div id="paintingsList"></div>
    </div>
  </div>
  
  <footer>
    <h3>NASTYA KUDRIAVTSEVA</h3>
    <p>instagram: @dee_teppich</p>
  </footer>

  <script src="paintings-data.js"></script>
  <script>
    const paintingsList = document.getElementById('paintingsList');
    let allPaintings = [];

    function loadPaintings() {
      if (typeof paintingsMarkdown !== 'undefined') {
        parsePaintings(paintingsMarkdown);
        renderPaintings();
      } else {
        paintingsList.innerHTML = '<p>Could not load paintings data.</p>';
      }
    }

    function parsePaintings(markdown) {
      allPaintings = [];
      const blocks = markdown.split('---').map(b => b.trim()).filter(b => b);

      blocks.forEach(block => {
        const lines = block.split('\n');
        let title = 'Untitled';
        let author = 'Unknown';
        let image = '';

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (line.toLowerCase().startsWith('title:')) {
            title = line.substring(6).trim();
          } else if (line.toLowerCase().startsWith('author:')) {
            author = line.substring(7).trim();
          } else if (line.toLowerCase().startsWith('image:')) {
            image = line.substring(6).trim();
          }
        }

        allPaintings.push({
          title,
          author,
          image
        });
      });
    }

    function renderPaintings() {
      paintingsList.innerHTML = '';
      
      if (allPaintings.length === 0) {
        paintingsList.innerHTML = '<p>No paintings found.</p>';
        return;
      }

      const searchQuery = (document.getElementById('searchInput').value || '').toLowerCase();

      const filteredPaintings = allPaintings.filter(painting => {
        if (!searchQuery) return true;
        
        const aMatch = painting.author.toLowerCase().includes(searchQuery);
        const tiMatch = painting.title.toLowerCase().includes(searchQuery);
        return aMatch || tiMatch;
      });

      if (filteredPaintings.length === 0) {
        paintingsList.innerHTML = '<p>No matching paintings found.</p>';
        return;
      }

      // Group by author
      const paintingsByAuthor = {};
      filteredPaintings.forEach(painting => {
        if (!paintingsByAuthor[painting.author]) {
          paintingsByAuthor[painting.author] = [];
        }
        paintingsByAuthor[painting.author].push(painting);
      });

      // Sort authors alphabetically
      const authors = Object.keys(paintingsByAuthor).sort();

      authors.forEach(author => {
        const authorHeader = document.createElement('h3');
        authorHeader.style.marginTop = '30px';
        authorHeader.style.borderBottom = '1px solid #ccc';
        authorHeader.style.paddingBottom = '5px';
        authorHeader.textContent = author;
        paintingsList.appendChild(authorHeader);

        paintingsByAuthor[author].forEach(painting => {
          const card = document.createElement('div');
          card.className = 'painting-card';
          
          let imgTag = painting.image ? `<img src="${escapeHtml(painting.image)}" alt="${escapeHtml(painting.title)}" loading="lazy">` : '';

          card.innerHTML = `
            <h3 style="margin: 0;">${escapeHtml(painting.title)}</h3>
            ${imgTag}
          `;
          paintingsList.appendChild(card);
        });
      });
    }

    function escapeHtml(unsafe) {
      const div = document.createElement('div');
      div.textContent = unsafe;
      return div.innerHTML;
    }

    // Initial load
    loadPaintings();
  </script>
<script src="scripts/theme-switcher.js"></script>
</body>
</html>
