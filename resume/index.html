<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link rel="stylesheet" type="text/css" href="../styles/themes/neobrutalism.css" />
</head>
<body>
    
    <div class="container">
        <header>
            <h1>Anastasiia Kudriavtseva</h1>
            <p>Software Engineer</p>
        </header>

        <section class="skills-section">
            <h2>Relevant Skills</h2>
            <div class="skills-container" id="skills-container">
            </div>
        </section>

        <div class="main-grid">
            <div class="left-column">
                <section class="timeline-section">
                    <h2>Experience & Education</h2>
                    <div class="timeline" id="timeline">
                    </div>
                </section>
            </div>
            
            <div class="right-column">
                <section class="showcase-section talks-section">
                    <h2>Looking for a speaker?</h2>
                    <div id="talks-container">
                    </div>
                </section>

                <section class="showcase-section">
                    <h2>Past Projects</h2>
                    <div id="showcase-container">
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="../scripts/resume.js"></script>
    <script src="../scripts/theme-switcher.js"></script>
</body>
</html>
